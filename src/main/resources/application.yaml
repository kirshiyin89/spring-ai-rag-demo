spring:
  application:
    name: fintech-ai-assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/changes/db.changelog-master.yaml

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        extra-body:
          include_reasoning: false

    mcp:
      client:
        name: finflow-assistant
        version: 0.0.1
        type: SYNC
        request-timeout: 30s
        streamable-http:
          connections:
            youtrack:
              url: http://localhost:8090
              endpoint: /mcp

    model:
      embedding: transformers

    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true

app:
  rag:
    similarity-threshold: 0.35
  security:
    it-support:
      username: ${IT_SUPPORT_USERNAME}
      password: ${IT_SUPPORT_PASSWORD}
    it-admin:
      username: ${IT_ADMIN_USERNAME}
      password: ${IT_ADMIN_PASSWORD}