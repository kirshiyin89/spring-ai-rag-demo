spring:
  application:
    name: fintech-ai-assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/changes/db.changelog-master.yaml

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        extra-body:
          include_reasoning: false

    mcp:
      client:
        enabled: false

    model:
      embedding: transformers

    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  rag:
    similarity-threshold: 0.35
  public-chat:
    # Origins allowed to call the anonymous Brewly chat endpoint (comma-separated).
    allowed-origins: ${PUBLIC_CHAT_ALLOWED_ORIGINS:http://localhost:3000}
    # Per client IP limit for the anonymous endpoint.
    max-requests-per-minute: 10
  crawler:
    max-pages: 50
    max-depth: 5
    request-timeout: 10s
    # Each tenant's start URL lives in tenants.crawl_start_url. These settings apply to every
    # tenant that has one. Nightly crawl at 02:00 Budapest time. Cron fields: sec min hour day month weekday.
    cron: "0 0 2 * * *"
    zone: Europe/Budapest
    # If a site is offline, retry after this delay, up to max-attempts times in total.
    retry-delay: 1h
    max-attempts: 3
  integrations:
    youtrack:
      url: http://localhost:8090
      endpoint: /mcp
      request-timeout: 10s
      base-url: https://curiousdevscorner.youtrack.cloud/
      shared-secret: ${MCP_SHARED_SECRET}
  security:
    it-support:
      username: ${IT_SUPPORT_USERNAME}
      password: ${IT_SUPPORT_PASSWORD}
    it-admin:
      username: ${IT_ADMIN_USERNAME}
      password: ${IT_ADMIN_PASSWORD}
    brewly:
      username: ${BREWLY_USERNAME}
      password: ${BREWLY_PASSWORD}
  groq:
    api-key: ${GROQ_API_KEY}
    voice:
      transcription:
        model: whisper-large-v3-turbo
  image-analysis:
    model: qwen/qwen3.8-27b

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

  tenancy:
    # Login usernames per tenant slug (comma-separated). A new tenant needs a new entry here.
    users:
      finflow: "${DB_USERNAME},${IT_SUPPORT_USERNAME},${IT_ADMIN_USERNAME}"
      brewly: ${BREWLY_USERNAME}

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.web.client: DEBUG
    org.springframework.http.client: DEBUG