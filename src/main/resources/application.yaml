spring:
  application:
    name: fintech-ai-assistant

  datasource:
    url: jdbc:postgresql://localhost:5432/ragdb
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  liquibase:
    change-log: classpath:db/changelog/changes/db.changelog-master.yaml

  ai:
    openai:
      api-key: ${GROQ_API_KEY}
      base-url: https://api.groq.com/openai/v1
      chat:
        model: openai/gpt-oss-120b
        extra-body:
          include_reasoning: false

    mcp:
      client:
        enabled: false

    model:
      embedding: transformers

    vectorstore:
      type: pgvector
      pgvector:
        initialize-schema: true
  jpa:
    hibernate:
      ddl-auto: validate

app:
  rag:
    similarity-threshold: 0.35
  integrations:
    youtrack:
      url: http://localhost:8090
      endpoint: /mcp
      request-timeout: 10s
      base-url: https://curiousdevscorner.youtrack.cloud/
      shared-secret: ${MCP_SHARED_SECRET}
  security:
    it-support:
      username: ${IT_SUPPORT_USERNAME}
      password: ${IT_SUPPORT_PASSWORD}
    it-admin:
      username: ${IT_ADMIN_USERNAME}
      password: ${IT_ADMIN_PASSWORD}
  groq:
    api-key: ${GROQ_API_KEY}
    voice:
      transcription:
        model: whisper-large-v3-turbo
  image-analysis:
    model: qwen/qwen3.8-27b

  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 6MB

logging:
  level:
    org.springframework.ai: DEBUG
    org.springframework.web.client: DEBUG
    org.springframework.http.client: DEBUG